<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Top Red Stripe -->
  <rect width="900" height="200" fill="#E41E26" y="0"/>
  <!-- Middle White Stripe -->
  <rect width="900" height="200" fill="#FFFFFF" y="200"/>
  <!-- Bottom Green Stripe -->
  <rect width="900" height="200" fill="#138808" y="400"/>
  <!-- Central Golden 21-Ray Sun (Ala Rengîn) -->
  <g transform="translate(450, 300)">
    <!-- 21 Solar Rays -->
    <g fill="#FEB81C">
      <!-- 21 rays at 360/21 = 17.142857 degrees each -->
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(0)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(17.142857)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(34.285714)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(51.428571)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(68.571429)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(85.714286)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(102.857143)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(120.000000)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(137.142857)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(154.285714)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(171.428571)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(188.571429)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(205.714286)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(222.857143)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(240.000000)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(257.142857)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(274.285714)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(291.428571)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(308.571429)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(325.714286)"/>
      <polygon points="0,-100 -9,-55 9,-55" transform="rotate(342.857143)"/>
      <!-- Center Sun Disc -->
      <circle r="55" fill="#FEB81C"/>
    </g>
  </g>
</svg>
